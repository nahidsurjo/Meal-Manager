<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stripe Sales Tracker</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f5f7fb;color:#172033} .app{display:flex;min-height:100vh}.sidebar{width:230px;background:#fff;border-right:1px solid #e7eaf0;padding:24px 16px;position:fixed;top:0;bottom:0}.brand{font-size:20px;font-weight:800;margin:4px 10px 28px}.nav{display:block;padding:12px 14px;border-radius:10px;color:#596273;text-decoration:none;margin:5px 0;cursor:pointer}.nav.active,.nav:hover{background:#eaf7fa;color:#009fbb;font-weight:700}.main{margin-left:230px;width:calc(100% - 230px);padding:30px}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.title{font-size:28px;font-weight:800}.muted{color:#778196}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#fff;border:1px solid #e6e9ef;border-radius:16px;padding:20px;box-shadow:0 3px 12px rgba(20,30,50,.04);cursor:pointer;transition:.18s}.card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(20,30,50,.08)}.label{font-size:13px;color:#768095;margin-bottom:10px}.value{font-size:26px;font-weight:800}.section{margin-top:28px}.section h2{font-size:19px}.panel{background:#fff;border:1px solid #e6e9ef;border-radius:16px;padding:20px}.row{display:flex;gap:12px;flex-wrap:wrap}.field{flex:1;min-width:160px}.field label{display:block;font-size:12px;color:#6c7688;margin-bottom:6px}.field input,.field select{width:100%;padding:11px;border:1px solid #dce1e8;border-radius:9px;font-size:14px}.btn{border:0;border-radius:9px;padding:11px 16px;background:#009fbb;color:#fff;font-weight:700;cursor:pointer}.btn.secondary{background:#eef2f6;color:#303a4b}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid #edf0f4;font-size:13px}th{color:#697386;background:#fafbfc}.hidden{display:none}.empty{padding:30px;text-align:center;color:#8a94a6}@media(max-width:900px){.sidebar{width:190px}.main{margin-left:190px;width:calc(100% - 190px)}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.sidebar{position:static;width:100%;height:auto}.app{display:block}.main{margin:0;width:100%;padding:18px}.grid{grid-template-columns:1fr}.topbar{align-items:flex-start;gap:10px;flex-direction:column}}
</style>
</head>
<body>
<div class="app"><aside class="sidebar"><div class="brand">Stripe Tracker</div><a class="nav active" data-target="dashboard">Dashboard</a><a class="nav" data-target="payments">Payments</a><a class="nav" data-target="withdrawals">Withdrawals</a><a class="nav" data-target="linkon">Linkon</a><a class="nav" data-target="shorikul">Shorikul</a><a class="nav" data-target="nahid">Nahid</a><a class="nav" data-target="settings">Settings</a></aside>
<main class="main"><section id="dashboard"><div class="topbar"><div><div class="title">Dashboard</div><div class="muted">Stripe payment and withdrawal overview</div></div></div><div class="grid" id="cards"></div><div class="section"><h2>Recent Payments</h2><div class="panel"><div id="recentPayments"></div></div></div><div class="section"><h2>Recent Withdrawals</h2><div class="panel"><div id="recentWithdrawals"></div></div></div></section>
<section id="payments" class="hidden"><div class="title">Payments</div><div class="section panel"><form id="paymentForm"><div class="row"><div class="field"><label>Date</label><input id="pDate" type="date" required></div><div class="field"><label>Buyer / Project</label><input id="pName" required></div><div class="field"><label>Gross USD</label><input id="pGross" type="number" step="0.01" required></div><div class="field"><label>Stripe Net USD</label><input id="pNet" type="number" step="0.01" required></div><div class="field"><label>Nahid commission / USD</label><input id="pCommission" type="number" step="0.01" value="4" required></div><div class="field" style="align-self:end"><button class="btn">Add Payment</button></div></div></form></div><div class="section panel"><div id="paymentsTable"></div></div></section>
<section id="withdrawals" class="hidden"><div class="title">Withdrawals</div><div class="section panel"><form id="withdrawalForm"><div class="row"><div class="field"><label>Date</label><input id="wDate" type="date" required></div><div class="field"><label>USD Withdrawn</label><input id="wUsd" type="number" step="0.01" required></div><div class="field"><label>Linkon Rate (BDT/USD)</label><input id="wRate" type="number" step="0.01" required></div><div class="field" style="align-self:end"><button class="btn">Add Withdrawal</button></div></div></form></div><div class="section panel"><div id="withdrawalsTable"></div></div></section>
<section id="linkon" class="hidden"><div class="title">Linkon</div><div class="section panel" id="linkonSummary"></div></section><section id="shorikul" class="hidden"><div class="title">Shorikul</div><div class="section panel" id="shorikulSummary"></div></section><section id="nahid" class="hidden"><div class="title">Nahid</div><div class="section panel" id="nahidSummary"></div></section>
<section id="settings" class="hidden"><div class="title">Settings</div><div class="section panel"><div class="row"><div class="field"><label>Nahid commission rate (BDT/USD)</label><input id="settingsCommission" type="number" step="0.01" value="4"></div><div class="field"><label>Shorikul payout rate (BDT/USD)</label><input id="settingsShorikul" type="number" step="0.01" value="111"></div><div class="field" style="align-self:end"><button class="btn" id="saveSettings">Save Settings</button></div></div></div></section>
</main></div>
<script>
const KEY='stripe_tracker_v1';let state=JSON.parse(localStorage.getItem(KEY)||'null')||{payments:[],withdrawals:[],commission:4,shorikulRate:111};
const money=n=>'$'+Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});const bdt=n=>'৳'+Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
function save(){localStorage.setItem(KEY,JSON.stringify(state));render()};function net(){return state.payments.reduce((s,p)=>s+Number(p.net),0)}function gross(){return state.payments.reduce((s,p)=>s+Number(p.gross),0)}function withdrawn(){return state.withdrawals.reduce((s,w)=>s+Number(w.usd),0)}function shorikulPayout(w){return Number(w.usd)*state.shorikulRate}function linkonProfit(w){return Number(w.usd)*(Number(w.rate)-state.shorikulRate)}function commission(){return net()*state.commission}
function render(){const n=net(),wd=withdrawn(),rem=Math.max(0,n-wd),lp=state.withdrawals.reduce((s,w)=>s+linkonProfit(w),0),sp=state.withdrawals.reduce((s,w)=>s+shorikulPayout(w),0),nc=commission();const nahidPaid=wd*state.commission, nr=Math.max(0,nc-nahidPaid);document.getElementById('cards').innerHTML=[['Gross Payments',money(gross()),'payments'],['Net After Stripe',money(n),'payments'],['USD Withdrawn',money(wd),'withdrawals'],['Remaining USD',money(rem),'payments'],['Linkon Profit',bdt(lp),'linkon'],['Shorikul Paid',bdt(sp),'shorikul'],['Shorikul Remaining',bdt(rem*state.shorikulRate),'shorikul'],['Nahid Paid',bdt(nahidPaid),'nahid'],['Nahid Remaining',bdt(nr),'nahid']].map(x=>`<div class="card" data-target="${x[2]}"><div class="label">${x[0]}</div><div class="value">${x[1]}</div></div>`).join('');document.querySelectorAll('.card').forEach(c=>c.onclick=()=>show(c.dataset.target));renderTables();document.getElementById('linkonSummary').innerHTML=`<div class="value">${bdt(lp)}</div><p class="muted">Total Linkon profit</p>`;document.getElementById('shorikulSummary').innerHTML=`<div class="value">${bdt(sp)}</div><p class="muted">Paid to Shorikul</p><p>Remaining: ${bdt(rem*state.shorikulRate)}</p>`;document.getElementById('nahidSummary').innerHTML=`<div class="value">${bdt(nahidPaid)}</div><p class="muted">Paid to Nahid</p><p>Remaining: ${bdt(nr)}</p>`}
function table(rows,headers){if(!rows.length)return '<div class="empty">No entries yet.</div>';return '<div class="table-wrap"><table><thead><tr>'+headers.map(h=>`<th>${h}</th>`).join('')+'</tr></thead><tbody>'+rows.join('')+'</tbody></table></div>'}
function renderTables(){const ps=[...state.payments].sort((a,b)=>b.date.localeCompare(a.date)||b.created-a.created);document.getElementById('paymentsTable').innerHTML=table(ps.map(p=>`<tr><td>${p.date}</td><td>${p.name}</td><td>${money(p.gross)}</td><td>${money(p.net)}</td><td>${bdt(Number(p.net)*state.commission)}</td></tr>`),['Date','Project','Gross','Net','Commission']);document.getElementById('recentPayments').innerHTML=table(ps.slice(0,5).map(p=>`<tr><td>${p.date}</td><td>${p.name}</td><td>${money(p.net)}</td></tr>`),['Date','Project','Net']);const ws=[...state.withdrawals].sort((a,b)=>b.date.localeCompare(a.date)||b.created-a.created);document.getElementById('withdrawalsTable').innerHTML=table(ws.map(w=>`<tr><td>${w.date}</td><td>${money(w.usd)}</td><td>${bdt(w.rate)}</td><td>${bdt(w.usd*w.rate)}</td><td>${bdt(linkonProfit(w))}</td></tr>`),['Date','USD','Rate','Withdrawn BDT','Linkon Profit']);document.getElementById('recentWithdrawals').innerHTML=table(ws.slice(0,5).map(w=>`<tr><td>${w.date}</td><td>${money(w.usd)}</td><td>${bdt(linkonProfit(w))}</td></tr>`),['Date','USD','Profit'])}
function show(id){document.querySelectorAll('main section').forEach(s=>s.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.target===id))}document.querySelectorAll('.nav').forEach(n=>n.onclick=()=>show(n.dataset.target));
document.getElementById('paymentForm').onsubmit=e=>{e.preventDefault();state.payments.push({date:pDate.value,name:pName.value,gross:+pGross.value,net:+pNet.value,created:Date.now()});e.target.reset();pCommission.value=state.commission;save();show('payments')};document.getElementById('withdrawalForm').onsubmit=e=>{e.preventDefault();state.withdrawals.push({date:wDate.value,usd:+wUsd.value,rate:+wRate.value,created:Date.now()});e.target.reset();save();show('withdrawals')};document.getElementById('saveSettings').onclick=()=>{state.commission=+settingsCommission.value;state.shorikulRate=+settingsShorikul.value;save()};settingsCommission.value=state.commission;settingsShorikul.value=state.shorikulRate;pCommission.value=state.commission;render();
</script></body></html>
