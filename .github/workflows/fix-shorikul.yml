name: Fix Shorikul payout calculation
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix calculation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('stripe-sales-tracker.html')
          s=p.read_text()
          old='Math.max(0,Math.max(0,n-w)*S.shorikulRate-sp)'
          new='Math.max(0,W()*S.shorikulRate-sp)'
          if old not in s:
              raise SystemExit('target calculation not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stripe-sales-tracker.html
          git commit -m 'Fix Shorikul payout calculation' || exit 0
          git push
