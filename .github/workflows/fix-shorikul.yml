name: Fix StripeFlow navigation persistence
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch StripeFlow refresh persistence
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('stripe-saas.html')
          s = p.read_text(encoding='utf-8')
          marker = 'STRIPEFLOW_REFRESH_NAV_V1'

          if marker not in s:
              patch = r'''<script>
          /* STRIPEFLOW_REFRESH_NAV_V1 */
          (function () {
            const KEY = 'stripeflow_current_page_v1';
            const PAGES = ['dashboard', 'nahid', 'linkon', 'shorikul', 'settings'];
            const valid = p => PAGES.includes(p) ? p : 'dashboard';

            function savePage(p) {
              try { localStorage.setItem(KEY, valid(p)); } catch (e) {}
            }

            function restorePage() {
              let p = 'dashboard';
              try { p = valid(localStorage.getItem(KEY) || 'dashboard'); } catch (e) {}
              if (typeof window.show === 'function') window.show(p);
            }

            document.addEventListener('click', function (e) {
              const nav = e.target.closest('.nav[data-page]');
              if (nav) savePage(nav.dataset.page);
            }, true);

            setTimeout(restorePage, 0);
          })();
          </script>'''
              if '</body>' not in s:
                  raise SystemExit('stripe-saas.html: </body> not found')
              p.write_text(s.replace('</body>', patch + '</body>', 1), encoding='utf-8')
              print('StripeFlow refresh persistence installed.')
          else:
              print('StripeFlow refresh persistence already installed.')

          # Preserve the earlier Shorikul payout fix for the older tracker if present.
          old = 'Math.max(0,Math.max(0,n-w)*S.shorikulRate-sp)'
          new = 'Math.max(0,W()*S.shorikulRate-sp)'
          q = Path('stripe-sales-tracker.html')
          if q.exists():
              t = q.read_text(encoding='utf-8')
              if old in t:
                  q.write_text(t.replace(old, new, 1), encoding='utf-8')
                  print('Older tracker Shorikul calculation fixed.')
          PY
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stripe-saas.html stripe-sales-tracker.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix StripeFlow refresh section persistence'
          git push
